services:
  postgres:
    image: postgres:17                 # official image, multi-arch: runs natively on the M4
    environment:
      POSTGRES_DB: orders              # database created on first start
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orders -d orders" ]  # exit 0 = accepting connections
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:4.2.0          # official image, KRaft only
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw            # used to format KRaft storage on first start
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # one node does both jobs
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093  # node 1 is the only controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      # asks the broker for its API versions; succeeds only when the broker answers
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s                # failures in the first 15 s don't count