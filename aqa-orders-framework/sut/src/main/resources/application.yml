spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders   # the port published by the override file
    username: orders
    password: orders
  kafka:
    bootstrap-servers: localhost:9092              # the EXTERNAL listener
  liquibase:
    enabled: true

logging:
   pattern:
     level: "%5p [%X{correlationId:-}]"

management:
  endpoint:
    health:
      show-details: always   # list each component (db, disk space...) in the response

spring.liquibase.contexts: test